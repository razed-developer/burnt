<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0e0e0"/>
      <stop offset="50%" stop-color="#f8f8f8"/>
      <stop offset="100%" stop-color="#c0c0c0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Outer disc -->
  <circle cx="256" cy="256" r="240" fill="url(#disc)" stroke="#999" stroke-width="3"/>
  <!-- Rainbow reflection -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#shine)" stroke-width="40" opacity="0.3"/>
  <!-- Data area rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#ddd" stroke-width="1" opacity="0.5"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#ddd" stroke-width="1" opacity="0.4"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#ddd" stroke-width="1" opacity="0.3"/>
  <!-- Inner hub -->
  <circle cx="256" cy="256" r="60" fill="#f0f0f0" stroke="#ccc" stroke-width="2"/>
  <!-- Center hole -->
  <circle cx="256" cy="256" r="20" fill="#1a1a1a"/>
  <!-- Fire/flame accent -->
  <path d="M256 100 C256 100 290 140 280 170 C275 185 290 195 280 215 C275 225 260 220 256 200 C252 220 237 225 232 215 C222 195 237 185 232 170 C222 140 256 100 256 100Z" fill="#2563eb" opacity="0.85"/>
  <path d="M256 120 C256 120 275 148 270 165 C267 175 277 180 272 192 C269 198 260 196 256 184 C252 196 243 198 240 192 C235 180 245 175 242 165 C237 148 256 120 256 120Z" fill="#3b82f6" opacity="0.9"/>
</svg>
